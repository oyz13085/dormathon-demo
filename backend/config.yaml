# FairQueue configuration. Change values here, not in code.

llm:
  provider: anthropic
  model: claude-opus-5-5        # swap freely; any Claude model id works
  effort: low                   # short classification-style calls
  timeout_seconds: 8            # beyond this the rule-based fallback is used
  max_tokens: 1024

# Working-time assumptions used by the schedule, risk and what-if engines
work:
  hours_per_day: 8
  handover_buffer_hours: 1.5    # used when history has no handover timings

# Deadline-risk alerts
alerts:
  threshold: 0.5                # p_miss at or above this raises an alert
  max_per_day: 5                # cap on alerts shown to the lead per day

# Service targets when the data has no deadline: multiple of median duration per priority
service_target_multiplier: 1.5

# Historical ticket data used for model training and the replay.
# Drop the Mendeley Help Desk Tickets CSV into data/raw/ and set the column names below.
# If data/raw/ is empty, a synthetic history (clearly labelled as such) is generated instead.
history:
  columns:
    id: ticket_id
    created_at: created_at
    closed_at: closed_at
    category: category
    priority: priority
    project: project            # mapped to a department via data/department_map.csv
    assignee: assignee
    effort_hours: effort_hours  # leave as-is if absent; duration is used instead
    handovers: handovers        # optional
  test_fraction: 0.3            # time-based split: last 30% of tickets are the test period
